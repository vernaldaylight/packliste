# Baut die App und veröffentlicht `dist/` auf GitHub Pages.
#
# Die Tests laufen hier mit. In CI fehlt die private Arbeitskopie des
# Katalogs, also überspringen sich die Tests gegen den echten Katalog von
# selbst; alles andere läuft gegen den Fixture.
#
# Veröffentlicht wird nur die App-Hülle: `dist/` enthält keinen Katalog und
# keine Reisen (PRD §4.5, O11).
name: Deploy auf GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Ein Deploy zur Zeit. Läuft schon einer, wird der ältere abgebrochen —
# sonst könnten sich zwei Läufe beim Veröffentlichen überholen.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci
      - run: npm test
      - run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
